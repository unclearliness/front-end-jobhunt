<main class="explore-companies-page">
  <app-dashboard-header />

  <app-job-search-banner title="Explore Top Companies" searchPlaceholder="Search companies"
    searchAriaLabel="Search companies" formAriaLabel="Search companies" [showLocationField]="false"
    (searchSubmitted)="onSearchSubmitted($event)" />

  <section class="explore-companies-content" aria-label="Company search results">
    <div class="explore-companies-content__container">
      <app-job-filter-sidebar class="explore-companies-content__sidebar" [filterGroups]="filterGroups"
        (filtersReset)="onFiltersReset()" />

      <div class="explore-companies-content__results">
        <header class="results-header">
          <p class="results-header__count">{{ totalItems() }} companies found</p>

          <label class="results-header__sort">
            <span class="results-header__sort-label">Sort companies</span>
            <select class="results-header__select" aria-label="Sort companies">
              <option>Most Jobs</option>
              <option>Company Name</option>
              <option>Newest</option>
            </select>
          </label>
        </header>

        <div class="company-results-grid">
          @for (company of companies(); track company.id) {
          <app-company-card [company]="company" (viewCompany)="onViewCompany($event)" />
          }
        </div>

        <app-pagination [currentPage]="currentPage()" [totalPages]="totalPages()" [totalItems]="totalItems()"
          [pageSize]="pageSize()" (pageChange)="onPageChange($event)" />
      </div>
    </div>
  </section>
</main>
