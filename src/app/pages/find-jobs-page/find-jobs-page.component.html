<main class="find-jobs-page">
  <app-dashboard-header />

  <app-job-search-banner title="Find Your Next Opportunity" searchPlaceholder="Job title or keyword"
    [showLocationField]="false" (searchSubmitted)="onSearchSubmitted($event)" />

  <section class="find-jobs-content" aria-label="Job search results">
    <div class="find-jobs-content__container">
      <app-job-filter-sidebar class="find-jobs-content__sidebar" [filterGroups]="filterGroups()"
        (filtersReset)="onFiltersReset()" (filterChanged)="onFilterChanged($event)" />

      <div class="find-jobs-content__results">
        <div class="job-results-list">
          @for (job of jobs(); track job.id) {
          <app-job-card [job]="job" (viewDetails)="onViewDetails($event)" />
          } @empty {
          <div class="no-data">No data found!</div>
          }
        </div>
      </div>

    </div>
    <app-pagination [currentPage]="currentPage()" [totalPages]="totalPages()" [totalItems]="totalItems()"
      [pageSize]="pageSize()" (pageChange)="onPageChange($event)" />
  </section>
</main>
