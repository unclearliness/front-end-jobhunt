<main class="login-page">
  <section class="login-card" aria-labelledby="login-title">
    <header class="login-header">
      <div class="login-logo" aria-hidden="true">
        <svg
          class="login-logo__icon"
          width="28"
          height="28"
          viewBox="0 0 28 28"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M9.625 9.625V7.875C9.625 6.9085 10.4085 6.125 11.375 6.125H16.625C17.5915 6.125 18.375 6.9085 18.375 7.875V9.625M7 9.625H21C21.9665 9.625 22.75 10.4085 22.75 11.375V21C22.75 21.9665 21.9665 22.75 21 22.75H7C6.0335 22.75 5.25 21.9665 5.25 21V11.375C5.25 10.4085 6.0335 9.625 7 9.625Z"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M10.5 9.625V22.75M17.5 9.625V22.75"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </div>

      <h1 class="login-title" id="login-title">Welcome back</h1>
      <p class="login-subtitle">Sign in to your JobHunter account</p>
    </header>

    <form class="login-form" [formGroup]="loginForm" (ngSubmit)="submitForm()">
      <div class="form-field">
        <label class="form-label" for="username">Username</label>
        <input
          class="form-input"
          id="username"
          type="text"
          formControlName="username"
          placeholder="Enter your username"
          autocomplete="username"
        />
      </div>

      <div class="form-field">
        <div class="form-label-row">
          <label class="form-label" for="password">Password</label>
          <a class="text-link" href="#" aria-label="Reset your password">Forgot password?</a>
        </div>

        <input
          class="form-input"
          id="password"
          type="password"
          formControlName="password"
          placeholder="Enter your password"
          autocomplete="current-password"
        />
      </div>

      <button class="primary-button" type="submit">Sign In</button>
    </form>

    <div class="divider" aria-hidden="true">
      <span class="divider__text">OR</span>
    </div>

    <div class="social-login" aria-label="Social login options">
      <button class="social-button" type="button">Google</button>
      <button class="social-button" type="button">LinkedIn</button>
    </div>

    <footer class="login-footer">
      <p>
        Don't have an account?
        <a class="text-link" routerLink="/register-job-seeker">Sign up as Job Seeker</a>
        or
        <a class="text-link" routerLink="/register-employer">Employer</a>
      </p>
    </footer>
  </section>
</main>
