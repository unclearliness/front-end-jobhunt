<main class="employer-register-page">
  <section class="employer-register-card" aria-labelledby="employer-register-title">
    <header class="employer-register-header">
      <div class="employer-register-icon" aria-hidden="true">
        <svg
          class="employer-register-icon__graphic"
          width="28"
          height="28"
          viewBox="0 0 28 28"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M8.75 23.625V7.875C8.75 6.9085 9.5335 6.125 10.5 6.125H17.5C18.4665 6.125 19.25 6.9085 19.25 7.875V23.625"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M5.25 23.625H22.75"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
          <path
            d="M12.25 10.5H15.75M12.25 14H15.75M12.25 17.5H15.75"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
          <path
            d="M6.125 23.625V14.875C6.125 13.9085 6.9085 13.125 7.875 13.125H8.75M19.25 13.125H20.125C21.0915 13.125 21.875 13.9085 21.875 14.875V23.625"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>

      <h1 class="employer-register-title" id="employer-register-title">
        Create Employer Account
      </h1>
      <p class="employer-register-subtitle">Find the best talent for your company</p>
    </header>

    <form
      class="employer-register-form"
      [formGroup]="employerRegisterForm"
      (ngSubmit)="onSubmit()"
    >
      <div class="form-field">
        <label class="form-label" for="companyName">Company Name</label>
        <input
          class="form-input"
          id="companyName"
          type="text"
          formControlName="companyName"
          placeholder="Acme Corporation"
          autocomplete="organization"
        />
      </div>

      <div class="form-row">
        <div class="form-field">
          <label class="form-label" for="firstName">First Name</label>
          <input
            class="form-input"
            id="firstName"
            type="text"
            formControlName="firstName"
            placeholder="John"
            autocomplete="given-name"
          />
        </div>

        <div class="form-field">
          <label class="form-label" for="lastName">Last Name</label>
          <input
            class="form-input"
            id="lastName"
            type="text"
            formControlName="lastName"
            placeholder="Doe"
            autocomplete="family-name"
          />
        </div>
      </div>

      <div class="form-field">
        <label class="form-label" for="email">Work Email</label>
        <input
          class="form-input"
          id="email"
          type="email"
          formControlName="email"
          placeholder="you@company.com"
          autocomplete="email"
        />
      </div>

      <div class="form-field">
        <label class="form-label" for="password">Password</label>
        <input
          class="form-input"
          id="password"
          type="password"
          formControlName="password"
          placeholder="Create a password"
          autocomplete="new-password"
        />
      </div>

      <div class="form-field">
        <label class="form-label" for="phone">Phone Number</label>
        <input
          class="form-input"
          id="phone"
          type="tel"
          formControlName="phone"
          placeholder="+1 (555) 000-0000"
          autocomplete="tel"
        />
      </div>

      <button class="primary-button" type="submit">Create Account</button>
    </form>

    <div class="divider" aria-hidden="true">
      <span class="divider__text">OR</span>
    </div>

    <div class="social-register" aria-label="Social registration options">
      <button class="social-button" type="button">Google</button>
      <button class="social-button" type="button">LinkedIn</button>
    </div>

    <footer class="employer-register-footer">
      <p>
        Already have an account?
        <a class="text-link" routerLink="/login">Sign in</a>
      </p>
      <p>
        Looking for a job?
        <a class="text-link" routerLink="/register-job-seeker">Register as Job Seeker</a>
      </p>
    </footer>
  </section>
</main>
